name: Patch logo.png.b64.r01 HOMELIGHT bytes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-r01.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix 4 corrupted base64 bytes in r01
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import hashlib
          p = Path('assets/logo.png.b64.r01')
          data = bytearray(p.read_bytes())
          assert len(data) == 7000
          # known corruptions vs local HOMELIGHT chunk
          assert data[414:417] == b'A3S', data[414:417]
          data[414:417] = b'B6A'
          assert data[3382] == ord('J'), chr(data[3382])
          data[3382] = ord('L')
          p.write_bytes(data)
          blob = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
          print('patched blob', blob)
          assert blob == '61862d5aa758d24200208cd999fa8ea1562f7ead'
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo.png.b64.r01
          git commit -m "Fix corrupted bytes in HOMELIGHT logo.png.b64.r01"
          git push
      - name: Remove one-shot patch workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-r01.yml
          git commit -m "Remove one-shot patch-r01 workflow" || true
          git push || true
