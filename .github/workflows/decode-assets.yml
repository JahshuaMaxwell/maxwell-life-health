name: Decode Tide Lantern assets
on:
  push:
    branches: [main]
    paths:
      - 'assets/*.b64'
      - '.github/workflows/decode-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 PNGs
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ -f assets/logo.png.b64 ]; then
            base64 -d assets/logo.png.b64 > assets/logo.png
            echo "decoded logo.png $(wc -c < assets/logo.png) bytes"
          fi
          if [ -f assets/logo-solid.png.b64 ]; then
            base64 -d assets/logo-solid.png.b64 > assets/logo-solid.png
            echo "decoded logo-solid.png $(wc -c < assets/logo-solid.png) bytes"
          fi
          # Sanity: PNG magic
          xxd -l 8 assets/logo.png
      - name: Commit PNGs if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo.png assets/logo-solid.png || true
          if git diff --cached --quiet; then
            echo "No PNG changes to commit"
          else
            git commit -m "Add Tide Lantern PNG assets (decoded from b64)"
            git push
          fi
