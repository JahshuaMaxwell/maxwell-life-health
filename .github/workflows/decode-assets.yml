name: Decode Tide Lantern assets
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - '.github/workflows/decode-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble b64 parts and decode PNGs
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ -f assets/_b64parts/logo.01.b64 ]; then
            sed -i 's/BpouYf/BvouYf/' assets/_b64parts/logo.01.b64
            echo "sed-patched logo.01.b64 if needed"
          fi
          : > assets/logo.png.b64
          for f in assets/_b64parts/logo.00.b64 assets/_b64parts/logo.01.b64; do
            if [ -f "$f" ]; then cat "$f" >> assets/logo.png.b64; fi
          done
          if ls assets/_b64parts/logo.r*.b64 >/dev/null 2>&1; then
            cat assets/_b64parts/logo.r*.b64 >> assets/logo.png.b64
          fi
          for i in 02 03 04 05; do
            if [ -f assets/_b64parts/logo.$i.b64 ]; then
              cat assets/_b64parts/logo.$i.b64 >> assets/logo.png.b64
            fi
          done
          cp assets/logo.png.b64 assets/logo-solid.png.b64
          echo "assembled logo.png.b64 $(wc -c < assets/logo.png.b64) bytes"
          base64 -d assets/logo.png.b64 > assets/logo.png
          base64 -d assets/logo-solid.png.b64 > assets/logo-solid.png
          echo "decoded logo.png $(wc -c < assets/logo.png) bytes"
          xxd -l 8 assets/logo.png
          test $(wc -c < assets/logo.png.b64) -eq 40192
          test $(wc -c < assets/logo.png) -gt 1000
      - name: Commit assembled assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf assets/_b64parts || true
          git add -A assets/
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
          else
            git commit -m "Add Tide Lantern PNG assets (decoded from b64)"
            git push
          fi
