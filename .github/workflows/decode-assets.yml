name: Decode HOMELIGHT logo assets
on:
  push:
    branches: [main]
    paths:
      - 'assets/*.b64'
      - 'assets/*.b64.r*'
      - 'assets/_micro/**'
      - 'assets/logo.js.r*'
      - '.github/workflows/decode-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble parts
        run: |
          set -euo pipefail
          mkdir -p assets

          if ls assets/_micro/logo.js.hex.p* >/dev/null 2>&1; then
            HN=$(ls assets/_micro/logo.js.hex.p* | wc -l | tr -d ' ')
            echo "js hex parts=$HN"
            if [ "$HN" = "4" ]; then
              cat $(ls assets/_micro/logo.js.hex.p* | sort) > assets/_micro/logo.js.hex
              xxd -r -p assets/_micro/logo.js.hex > logo.js
              echo "assembled logo.js from hex $(wc -c < logo.js)"
            fi
          elif [ -f assets/_micro/logo.js.hex ]; then
            xxd -r -p assets/_micro/logo.js.hex > logo.js
            echo "assembled logo.js from hex $(wc -c < logo.js)"
          elif ls assets/_micro/logo.js.p* >/dev/null 2>&1; then
            N=$(ls assets/_micro/logo.js.p* | wc -l | tr -d ' ')
            echo "js micro parts=$N"
            if [ "$N" = "36" ]; then
              cat $(ls assets/_micro/logo.js.p* | sort) > logo.js
              echo "assembled logo.js $(wc -c < logo.js)"
            else
              echo "waiting for 36 js micro parts"
            fi
          fi

          if ls assets/_micro/logo.png.b64.p* >/dev/null 2>&1; then
            N=$(ls assets/_micro/logo.png.b64.p* | wc -l | tr -d ' ')
            echo "png micro parts=$N"
            if [ "$N" = "85" ]; then
              cat $(ls assets/_micro/logo.png.b64.p* | sort) > assets/logo.png.b64
              echo "assembled logo.png.b64 $(wc -c < assets/logo.png.b64)"
            else
              echo "waiting for 85 png micro parts"
            fi
          fi

          png_parts=$(ls assets/logo.png.b64.r* 2>/dev/null | wc -l | tr -d ' ')
          js_parts=$(ls assets/logo.js.r* 2>/dev/null | wc -l | tr -d ' ')
          if [ "$png_parts" = "7" ]; then
            cat $(ls assets/logo.png.b64.r* | sort) > assets/logo.png.b64
          fi
          if [ "$js_parts" = "3" ]; then
            cat $(ls assets/logo.js.r* | sort) > logo.js
          fi

          if [ -f assets/logo.png.b64 ]; then
            cp assets/logo.png.b64 assets/logo-solid.png.b64
          fi
      - name: Decode PNGs
        run: |
          set -euo pipefail
          if [ ! -f assets/logo.png.b64 ]; then
            echo "no b64 yet"; exit 0
          fi
          BYTES=$(wc -c < assets/logo.png.b64 | tr -d ' ')
          if [ "$BYTES" -lt 1000 ]; then echo "b64 too small"; exit 1; fi
          base64 -d assets/logo.png.b64 > assets/logo.png
          cp assets/logo.png assets/logo-solid.png
          echo "decoded $(wc -c < assets/logo.png)"
          xxd -l 8 assets/logo.png
          PNG=$(wc -c < assets/logo.png | tr -d ' ')
          if [ "$PNG" -lt 10000 ]; then echo "png too small"; exit 1; fi
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo.png assets/logo-solid.png assets/logo.png.b64 assets/logo-solid.png.b64 logo.js || true
          if [ -f assets/logo.png ] && [ "$(wc -c < assets/logo.png | tr -d ' ')" = "31568" ]; then
            git rm -f assets/logo.png.b64.r* assets/logo-solid.png.b64.r* assets/logo.js.r* 2>/dev/null || true
            git rm -rf assets/_micro 2>/dev/null || true
          fi
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Decode/assemble HOMELIGHT lettering logo assets"
            git push
          fi
