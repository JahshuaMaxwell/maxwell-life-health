name: Decode Tide Lantern assets
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - '.github/workflows/decode-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble b64 parts and decode PNGs
        run: |
          set -euo pipefail
          mkdir -p assets
          if ls assets/_b64parts/logo.*.b64 >/dev/null 2>&1; then
            cat assets/_b64parts/logo.*.b64 > assets/logo.png.b64
            cp assets/logo.png.b64 assets/logo-solid.png.b64
            echo "assembled logo.png.b64 $(wc -c < assets/logo.png.b64) bytes"
          fi
          if [ -f assets/logo.png.b64 ]; then
            base64 -d assets/logo.png.b64 > assets/logo.png
            echo "decoded logo.png $(wc -c < assets/logo.png) bytes"
          fi
          if [ -f assets/logo-solid.png.b64 ]; then
            base64 -d assets/logo-solid.png.b64 > assets/logo-solid.png
            echo "decoded logo-solid.png $(wc -c < assets/logo-solid.png) bytes"
          fi
          xxd -l 8 assets/logo.png
          # verify size
          test $(wc -c < assets/logo.png.b64) -eq 40192
          test $(wc -c < assets/logo.png) -gt 1000
      - name: Commit assembled assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf assets/_b64parts || true
          git add -A assets/
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
          else
            git commit -m "Add Tide Lantern PNG assets (decoded from b64)"
            git push
          fi
