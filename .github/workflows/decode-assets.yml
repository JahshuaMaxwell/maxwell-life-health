name: Decode HOMELIGHT logo assets
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - '.github/workflows/decode-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 <<'PY'
          from pathlib import Path
          import base64, re
          root = Path('assets/_micro')
          parts = {}
          if root.exists():
              for p in root.iterdir():
                  m = re.fullmatch(r'logo\.js\.p(\d{3})', p.name)
                  if m:
                      parts[int(m.group(1))] = p.read_bytes()
              for i in range(1, 37):
                  segs = sorted(root.glob(f'logo.js.fix.p{i:03d}.s??'))
                  if len(segs) == 10:
                      parts[i] = b''.join(bytes.fromhex(s.read_text().strip()) for s in segs)
                      print('applied fix segs', i)
          if all(i in parts for i in range(1, 37)):
              data = b''.join(parts[i] for i in range(1, 37))
              Path('logo.js').write_bytes(data)
              print('assembled logo.js', len(data))
          else:
              miss = [i for i in range(1, 37) if i not in parts]
              print('js incomplete missing', miss)

          png_parts = []
          if root.exists():
              for p in sorted(root.iterdir()):
                  m = re.fullmatch(r'logo\.png\.b64\.p(\d{3})', p.name)
                  if m:
                      png_parts.append((int(m.group(1)), p))
          print('png micro parts', len(png_parts))
          if len(png_parts) == 85 and [i for i,_ in png_parts] == list(range(1, 86)):
              b64 = b''.join(p.read_bytes().strip() for _, p in png_parts)
              Path('assets/logo.png.b64').write_bytes(b64)
              Path('assets/logo-solid.png.b64').write_bytes(b64)
              png = base64.b64decode(b64)
              Path('assets/logo.png').write_bytes(png)
              Path('assets/logo-solid.png').write_bytes(png)
              print('decoded png', len(png))
          else:
              print('png not ready')
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -f assets/logo.png ]; then
            echo "png size $(wc -c < assets/logo.png)"
          fi
          if [ -f logo.js ]; then
            echo "logo.js size $(wc -c < logo.js)"
          fi
          if [ -f assets/logo.png ] && [ "$(wc -c < assets/logo.png | tr -d ' ')" = "31568" ]; then
            git rm -rf assets/_micro 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Decode/assemble HOMELIGHT lettering logo assets"
            git push
          fi
