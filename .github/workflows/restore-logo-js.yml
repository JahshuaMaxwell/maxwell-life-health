name: restore-logo-js
on:
  push:
    paths:
      - '.github/workflows/restore-logo-js.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write Homelight logo.js from known-good blob
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/JahshuaMaxwell/maxwell-life-health/28c78b2fdbfa93cb2304c9272df1f6e4ee328ff5/logo.js" \
            | sed '1s|^// Tide Lantern logo (embedded)$|// Homelight Financial lantern mark (embedded)|' \
            > logo.js
          head -n 1 logo.js | grep -Fqx '// Homelight Financial lantern mark (embedded)'
          grep -q PLACEHOLDER logo.js && exit 1 || true
          grep -q '__LOAD__' logo.js && exit 1 || true
          test "$(wc -c < logo.js)" -eq 19534
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo.js
          if git diff --cached --quiet; then
            echo "logo.js already correct"
            exit 0
          fi
          git commit -m "Comment: Tide Lantern → Homelight Financial on logo.js"
          git push
